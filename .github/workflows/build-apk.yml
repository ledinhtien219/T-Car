name: Build T-Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source/READY

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - name: Restore source
        run: |
          cat source/chunks/source.part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/tcar-source.zip
          echo "6dceee3907a924923ae7521190ece51aecd3a2d2138f2e7abbc4168a02512891  /tmp/tcar-source.zip" | sha256sum -c -
          mkdir project
          unzip -q /tmp/tcar-source.zip -d project
      - name: Build
        run: gradle -p project :app:assembleRelease --stacktrace
      - name: Collect APK
        run: |
          mkdir -p built
          apk="$(find project/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$apk"
          cp "$apk" built/T-Car.apk
          sha256sum built/T-Car.apk > built/T-Car.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: T-Car-APK
          path: |
            built/T-Car.apk
            built/T-Car.apk.sha256
