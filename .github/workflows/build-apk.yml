name: Build T-Car APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source/TCAR.zip
      - patches/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source ZIP
        run: |
          set -euo pipefail
          test -f source/TCAR.zip
          unzip -t source/TCAR.zip
          sha256sum source/TCAR.zip

      - name: Extract source, apply patches and detect version
        run: |
          set -euo pipefail
          rm -rf /tmp/tcar
          mkdir -p /tmp/tcar
          unzip -q source/TCAR.zip -d /tmp/tcar
          chmod -R u+rwX /tmp/tcar

          test -f /tmp/tcar/settings.gradle.kts
          test -f /tmp/tcar/app/build.gradle.kts

          if [ -f /tmp/tcar/gradle.properties ]; then
            sed -i '/^org\.gradle\.java\.home=/d' /tmp/tcar/gradle.properties
          fi

          # Normalize Kotlin sources so patches apply reliably even when the
          # original ZIP contains a mix of Windows CRLF and Unix LF line endings.
          find /tmp/tcar/app/src/main/java -type f -name '*.kt' -exec sed -i 's/\r$//' {} +

          if compgen -G "$GITHUB_WORKSPACE/patches/*.patch" > /dev/null; then
            while IFS= read -r patch_file; do
              echo "Applying patch: $patch_file"
              patch -d /tmp/tcar -p1 --forward < "$patch_file"
            done < <(find "$GITHUB_WORKSPACE/patches" -maxdepth 1 -type f -name '*.patch' | sort)
          fi

          if compgen -G "$GITHUB_WORKSPACE/patches/*.py" > /dev/null; then
            while IFS= read -r transform_script; do
              echo "Applying transform: $transform_script"
              python3 "$transform_script"
            done < <(find "$GITHUB_WORKSPACE/patches" -maxdepth 1 -type f -name '*.py' | sort)
          fi

          if [ -f "$GITHUB_WORKSPACE/patches/version.properties" ]; then
            source "$GITHUB_WORKSPACE/patches/version.properties"
            sed -i -E "s/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${VERSION_CODE}/" /tmp/tcar/app/build.gradle.kts
            sed -i -E "s/(versionName[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"${VERSION_NAME}\"/" /tmp/tcar/app/build.gradle.kts
          fi

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' /tmp/tcar/app/build.gradle.kts | head -1 || true)"
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' /tmp/tcar/app/build.gradle.kts | head -1 || true)"

          [ -n "$VERSION_NAME" ] || VERSION_NAME="unknown"
          [ -n "$VERSION_CODE" ] || VERSION_CODE="0"

          APK_NAME="T-Car_v${VERSION_NAME}_code${VERSION_CODE}_build${GITHUB_RUN_NUMBER}.apk"

          echo "TCAR_PROJECT=/tmp/tcar" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify Android Auto source declarations
        run: |
          set -euo pipefail
          manifest="$TCAR_PROJECT/app/src/main/AndroidManifest.xml"
          descriptor="$TCAR_PROJECT/app/src/main/res/xml/automotive_app_desc.xml"
          service="$TCAR_PROJECT/app/src/main/java/com/carhud/aaproxy/CarMediaBrowserService.kt"

          grep -F 'android:name="com.carhud.aaproxy.CarHudAutoService"' "$manifest"
          grep -F 'android:name="androidx.car.app.category.NAVIGATION"' "$manifest"
          grep -F 'android:name="com.carhud.aaproxy.CarMediaBrowserService"' "$manifest"
          grep -F 'android:label="T-Car Media"' "$manifest"
          grep -F 'android:name="android.media.browse.MediaBrowserService"' "$manifest"
          grep -F 'android:name="com.google.android.gms.car.application"' "$manifest"
          grep -F '<uses name="media"/>' "$descriptor"
          grep -F '<uses name="template"/>' "$descriptor"
          grep -F 'class CarMediaBrowserService : MediaBrowserServiceCompat()' "$service"
          grep -F 'sessionToken = session.sessionToken' "$service"
          grep -F 'isActive = true' "$service"

      - name: Guard version monotonicity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_CODE="$VERSION_CODE"
          CURRENT_NAME="$VERSION_NAME"
          CURRENT_PATCH="$(printf '%s' "$CURRENT_NAME" | awk -F. '{print $3}')"

          [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]
          [[ "$CURRENT_PATCH" =~ ^[0-9]+$ ]]

          HIST_MAX_CODE=0
          HIST_MAX_PATCH=0

          while IFS= read -r commit; do
            content="$(git show "$commit:patches/version.properties" 2>/dev/null || true)"
            code="$(printf '%s\n' "$content" | sed -n 's/^VERSION_CODE=//p' | head -1)"
            name="$(printf '%s\n' "$content" | sed -n 's/^VERSION_NAME=//p' | head -1)"
            patch="$(printf '%s' "$name" | awk -F. '{print $3}')"

            if [[ "$code" =~ ^[0-9]+$ ]] && (( code > HIST_MAX_CODE )); then
              HIST_MAX_CODE="$code"
            fi
            if [[ "$patch" =~ ^[0-9]+$ ]] && (( patch > HIST_MAX_PATCH )); then
              HIST_MAX_PATCH="$patch"
            fi
          done < <(git rev-list --all -- patches/version.properties)

          RELEASE_NAMES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].name' 2>/dev/null || true)"
          RELEASE_MAX_CODE="$(printf '%s\n' "$RELEASE_NAMES" | grep -oE 'code [0-9]+' | awk '{print $2}' | sort -nr | head -1 || true)"
          RELEASE_MAX_PATCH="$(printf '%s\n' "$RELEASE_NAMES" | grep -oE 'v0\.8\.[0-9]+' | awk -F. '{print $3}' | sort -nr | head -1 || true)"

          RELEASE_MAX_CODE="${RELEASE_MAX_CODE:-0}"
          RELEASE_MAX_PATCH="${RELEASE_MAX_PATCH:-0}"

          echo "Current: v$CURRENT_NAME / code $CURRENT_CODE"
          echo "Highest ever committed: patch $HIST_MAX_PATCH / code $HIST_MAX_CODE"
          echo "Highest released: patch $RELEASE_MAX_PATCH / code $RELEASE_MAX_CODE"

          if (( CURRENT_CODE < HIST_MAX_CODE )); then
            echo "::error::VERSION_CODE regressed: $CURRENT_CODE < historical $HIST_MAX_CODE"
            exit 1
          fi

          if (( CURRENT_PATCH < HIST_MAX_PATCH )); then
            echo "::error::VERSION_NAME regressed: 0.8.$CURRENT_PATCH < historical 0.8.$HIST_MAX_PATCH"
            exit 1
          fi

          if (( CURRENT_CODE <= RELEASE_MAX_CODE )); then
            echo "::error::VERSION_CODE must be greater than every released build: $CURRENT_CODE <= $RELEASE_MAX_CODE"
            exit 1
          fi

          if (( CURRENT_PATCH <= RELEASE_MAX_PATCH )); then
            echo "::error::VERSION_NAME must be greater than every released build: 0.8.$CURRENT_PATCH <= 0.8.$RELEASE_MAX_PATCH"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare stable signing
        env:
          TCAR_KEYSTORE_BASE64: ${{ secrets.TCAR_KEYSTORE_BASE64 }}
          TCAR_KEYSTORE_PASSWORD: ${{ secrets.TCAR_KEYSTORE_PASSWORD }}
          TCAR_KEY_ALIAS: ${{ secrets.TCAR_KEY_ALIAS }}
          TCAR_KEY_PASSWORD: ${{ secrets.TCAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TCAR_KEYSTORE_BASE64" ] || [ -z "$TCAR_KEYSTORE_PASSWORD" ] || [ -z "$TCAR_KEY_ALIAS" ] || [ -z "$TCAR_KEY_PASSWORD" ]; then
            echo "Stable signing secrets are not configured; compile-only mode."
            echo "TCAR_SIGNING_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYSTORE_PATH="/tmp/tcar-release.jks"

          python3 - <<'PY'
          import os, base64, re
          raw = os.environ["TCAR_KEYSTORE_BASE64"].strip()
          if raw.startswith("TCAR_KEYSTORE_BASE64="):
              raw = raw.split("=", 1)[1]
          raw = raw.strip().strip('"').strip("'")
          raw = re.sub(r"\\s+", "", raw)
          data = base64.b64decode(raw, validate=True)
          open("/tmp/tcar-release.jks", "wb").write(data)
          PY

          clean_secret() {
            local value="$1"
            local name="$2"
            value="${value#${name}=}"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "$value"
          }

          STORE_PASS="$(clean_secret "$TCAR_KEYSTORE_PASSWORD" "TCAR_KEYSTORE_PASSWORD")"
          KEY_ALIAS="$(clean_secret "$TCAR_KEY_ALIAS" "TCAR_KEY_ALIAS")"
          KEY_PASS="$(clean_secret "$TCAR_KEY_PASSWORD" "TCAR_KEY_PASSWORD")"

          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "TCAR_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "TCAR_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "TCAR_SIGNING_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "TCAR_SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TCAR_SIGNING_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"


      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build release
        env:
          TCAR_KEYSTORE_PASSWORD: ${{ env.TCAR_SIGNING_STORE_PASS }}
          TCAR_KEY_ALIAS: ${{ env.TCAR_SIGNING_ALIAS }}
          TCAR_KEY_PASSWORD: ${{ env.TCAR_SIGNING_KEY_PASS }}
        run: gradle -p "$TCAR_PROJECT" :app:assembleRelease --stacktrace

      - name: Verify Android Auto entries in built APK
        run: |
          set -euo pipefail
          apk="$(find "$TCAR_PROJECT/app/build/outputs/apk/release" -type f -name "*.apk" | head -1)"
          test -n "$apk"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$AAPT2"

          "$AAPT2" dump xmltree "$apk" --file AndroidManifest.xml > /tmp/tcar-manifest.txt
          "$AAPT2" dump xmltree "$apk" --file res/xml/automotive_app_desc.xml > /tmp/tcar-auto-desc.txt

          grep -F 'com.carhud.aaproxy.CarHudAutoService' /tmp/tcar-manifest.txt
          grep -F 'androidx.car.app.category.NAVIGATION' /tmp/tcar-manifest.txt
          grep -F 'com.carhud.aaproxy.CarMediaBrowserService' /tmp/tcar-manifest.txt
          grep -F 'android.media.browse.MediaBrowserService' /tmp/tcar-manifest.txt
          grep -F 'T-Car Media' /tmp/tcar-manifest.txt
          grep -F 'com.google.android.gms.car.application' /tmp/tcar-manifest.txt
          grep -F 'media' /tmp/tcar-auto-desc.txt
          grep -F 'template' /tmp/tcar-auto-desc.txt

          echo "Verified APK exposes both Android Auto entries: T-Car and T-Car Media"

      - name: Collect and verify signed APK
        if: env.TCAR_SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          mkdir -p built
          apk="$(find "$TCAR_PROJECT/app/build/outputs/apk/release" -type f -name "*.apk" | head -1)"
          test -n "$apk"
          cp "$apk" "built/$APK_NAME"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "built/$APK_NAME" | tee "built/$APK_NAME.cert.txt"
          grep -Eiq "(Signer #1|V[234](\\.[0-9]+)? Signer): certificate SHA-256 digest: 3d985f9622c39195ccd6ea5c24b659061aa1e9aab6cef79cf02bab8134245d46" "built/$APK_NAME.cert.txt"
          sha256sum "built/$APK_NAME" > "built/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        if: env.TCAR_SIGNING_READY == 'true'
        with:
          name: T-Car-v${{ env.VERSION_NAME }}-build-${{ github.run_number }}
          path: |
            built/${{ env.APK_NAME }}
            built/${{ env.APK_NAME }}.sha256
            built/${{ env.APK_NAME }}.cert.txt

      - name: Publish GitHub Release
        if: env.TCAR_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            "built/$APK_NAME" \
            "built/$APK_NAME.sha256" \
            "built/$APK_NAME.cert.txt" \
            --title "T-Car v$VERSION_NAME (code $VERSION_CODE) - build #$GITHUB_RUN_NUMBER" \
            --notes "Single APK build. Installing T-Car also exposes T-Car Media as a separate Android Auto media source."
