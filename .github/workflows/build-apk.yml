name: Build T-Car APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source/TCAR.zip
      - patches/**
      - signing/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          set -euo pipefail
          test -f source/TCAR.zip
          unzip -t source/TCAR.zip
          sha256sum source/TCAR.zip

      - name: Extract source, apply patches and detect version
        run: |
          set -euo pipefail
          rm -rf /tmp/tcar
          mkdir -p /tmp/tcar
          unzip -q source/TCAR.zip -d /tmp/tcar
          chmod -R u+rwX /tmp/tcar

          test -f /tmp/tcar/settings.gradle.kts
          test -f /tmp/tcar/app/build.gradle.kts

          if [ -f /tmp/tcar/gradle.properties ]; then
            sed -i '/^org\.gradle\.java\.home=/d' /tmp/tcar/gradle.properties
          fi

          # Normalize Kotlin sources so patches apply reliably even when the
          # original ZIP contains a mix of Windows CRLF and Unix LF line endings.
          find /tmp/tcar/app/src/main/java -type f -name '*.kt' -exec sed -i 's/\r$//' {} +
          sed -i 's/\r$//' /tmp/tcar/app/build.gradle.kts

          if compgen -G "$GITHUB_WORKSPACE/patches/*.patch" > /dev/null; then
            while IFS= read -r patch_file; do
              echo "Applying patch: $patch_file"
              patch -d /tmp/tcar -p1 --forward < "$patch_file"
            done < <(find "$GITHUB_WORKSPACE/patches" -maxdepth 1 -type f -name '*.patch' | sort)
          fi

          if [ -f "$GITHUB_WORKSPACE/patches/version.properties" ]; then
            source "$GITHUB_WORKSPACE/patches/version.properties"
            sed -i -E "s/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${VERSION_CODE}/" /tmp/tcar/app/build.gradle.kts
            sed -i -E "s/(versionName[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"${VERSION_NAME}\"/" /tmp/tcar/app/build.gradle.kts
          fi

          VERSION_NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' /tmp/tcar/app/build.gradle.kts | head -1 || true)"
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' /tmp/tcar/app/build.gradle.kts | head -1 || true)"

          [ -n "$VERSION_NAME" ] || VERSION_NAME="unknown"
          [ -n "$VERSION_CODE" ] || VERSION_CODE="0"

          APK_NAME="T-Car_v${VERSION_NAME}_code${VERSION_CODE}_build${GITHUB_RUN_NUMBER}.apk"

          echo "TCAR_PROJECT=/tmp/tcar" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare stable signing key
        env:
          TCAR_SIGNING_PASSWORD: ${{ secrets.TCAR_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TCAR_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret TCAR_SIGNING_PASSWORD"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tcar-signing"
          base64 -d "$GITHUB_WORKSPACE/signing/tcar-release.jks.enc.b64" |             openssl enc -d -aes-256-cbc -pbkdf2               -pass env:TCAR_SIGNING_PASSWORD               -out "$RUNNER_TEMP/tcar-signing/tcar-release.jks"
          chmod 600 "$RUNNER_TEMP/tcar-signing/tcar-release.jks"
          echo "TCAR_KEYSTORE_FILE=$RUNNER_TEMP/tcar-signing/tcar-release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build release
        env:
          TCAR_SIGNING_PASSWORD: ${{ secrets.TCAR_SIGNING_PASSWORD }}
        run: gradle -p "$TCAR_PROJECT" :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p built
          apk="$(find "$TCAR_PROJECT/app/build/outputs/apk/release" -type f -name "*.apk" | head -1)"
          test -n "$apk"
          cp "$apk" "built/$APK_NAME"
          sha256sum "built/$APK_NAME" > "built/$APK_NAME.sha256"

      - name: Verify stable APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "built/$APK_NAME" | tee built/signing-cert.txt
          actual="$(grep -m1 'Signer #1 certificate SHA-256 digest:' built/signing-cert.txt | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ':')"
          expected="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/signing/cert-sha256.txt" | tr 'A-F' 'a-f')"
          test "$actual" = "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: T-Car-v${{ env.VERSION_NAME }}-build-${{ github.run_number }}
          path: |
            built/${{ env.APK_NAME }}
            built/${{ env.APK_NAME }}.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG"             "built/$APK_NAME"             "built/$APK_NAME.sha256"             --title "T-Car v$VERSION_NAME (code $VERSION_CODE) - build #$GITHUB_RUN_NUMBER"             --notes "Automatic build from commit $GITHUB_SHA"
