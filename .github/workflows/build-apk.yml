name: Build T-Car APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - T-Car_source_ok.zip
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source
        run: |
          echo "6dceee3907a924923ae7521190ece51aecd3a2d2138f2e7abbc4168a02512891  T-Car_source_ok.zip" | sha256sum -c -
          unzip -t T-Car_source_ok.zip

      - name: Extract source
        run: |
          rm -rf /tmp/tcar
          mkdir -p /tmp/tcar
          unzip -q T-Car_source_ok.zip -d /tmp/tcar
          test -f /tmp/tcar/settings.gradle.kts
          test -f /tmp/tcar/app/build.gradle.kts
          sed -i '/^org\.gradle\.java\.home=/d' /tmp/tcar/gradle.properties
          echo "TCAR_PROJECT=/tmp/tcar" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build release
        run: gradle -p "$TCAR_PROJECT" :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p built
          apk="$(find "$TCAR_PROJECT/app/build/outputs/apk/release" -type f -name "*.apk" | head -1)"
          test -n "$apk"
          cp "$apk" built/T-Car.apk
          sha256sum built/T-Car.apk > built/T-Car.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: T-Car-APK
          path: |
            built/T-Car.apk
            built/T-Car.apk.sha256
