name: Build T-Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source/youtubepro_background_final.zip

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tested source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/youtubepro_background_final.zip
          echo "824899f63343f1e2da6d84b491ec5b4fd6fb5087ffbfde9384c932a658b98f7f  source/youtubepro_background_final.zip" | sha256sum -c -
          unzip -t source/youtubepro_background_final.zip

      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tcar-project
          mkdir -p /tmp/tcar-project
          unzip -q source/youtubepro_background_final.zip -d /tmp/tcar-project
          test -f /tmp/tcar-project/youtubepro/settings.gradle.kts
          test -f /tmp/tcar-project/youtubepro/app/build.gradle.kts
          rm -f /tmp/tcar-project/youtubepro/local.properties
          echo "TCAR_PROJECT=/tmp/tcar-project/youtubepro" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p built
          gradle -p "$TCAR_PROJECT" :app:assembleRelease --stacktrace 2>&1 | tee built/build.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "$TCAR_PROJECT/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$apk"
          cp "$apk" built/T-Car.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs built/T-Car.apk | tee -a built/build.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging built/T-Car.apk > built/badging.txt
          sha256sum built/T-Car.apk > built/T-Car.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: T-Car-APK
          path: |
            built/T-Car.apk
            built/T-Car.apk.sha256
            built/badging.txt
            built/build.log

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="tcar-build-${{ github.run_number }}"
          gh release create "$tag"             built/T-Car.apk             built/T-Car.apk.sha256             --title "T-Car build ${{ github.run_number }}"             --notes "Built from the tested background-playback source. Source SHA-256: 824899f63343f1e2da6d84b491ec5b4fd6fb5087ffbfde9384c932a658b98f7f"
